trigger:
  none
 
# pool: 3in1_VMSS

pool:
  vmImage: ubuntu-latest
 
stages:
- stage: pr_agent
  displayName: 'Code Review Stage'
  jobs:
  - job: pr_agent_job
    displayName: 'Code Review Stage'
    condition: eq(variables['Build.Reason'], 'PullRequest')
    container:
      image: codiumai/pr-agent:latest
      options: --entrypoint ""
    variables:
      - group: pr_agent
    steps:
    - checkout: self
      fetchDepth: 0   # #Fetch all history so that the branch reference is available
      clean: true
      fetchTags: false
      lfs: false
    - script: |
        echo "##vso[task.setvariable variable=GIT_CREDENTIALS]$(azure_devops_pat)"
        git config --global credential.helper store
        echo "https://$(Build.Repository.Name):$(GIT_CREDENTIALS)@$(Build.Repository.Uri)" > ~/.git-credentials
      env:
        azure_devops__pat: $(azure_devops_pat)
        openai__key: $(OPENAI_KEY)
      displayName: 'Fetch Latest Commits'
    - script: |
        echo "Running PR Agent action step"
 
        # Construct PR_URL
        PR_URL="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECT}/_git/${BUILD_REPOSITORY_NAME}/pullrequest/${SYSTEM_PULLREQUEST_PULLREQUESTID}"
        echo "PR_URL=$PR_URL"
 
        # Extract organization URL from System.CollectionUri
        ORG_URL=$(echo "$(System.CollectionUri)" | sed 's/\/$//') # Remove trailing slash if present
        echo "Organization URL: $ORG_URL"
 
        export azure_devops__org="https://dev.azure.com/BFLDevOpsOrg"
        export config__git_provider="azure"
 
        # pr-agent --pr_url="$PR_URL" describe
        pr-agent --pr_url="$PR_URL" review
        pr-agent --pr_url="$PR_URL" improve
        pr-agent --pr_url="$PR_URL" ask "Optimize the code for better performance."
        pr-agent --pr_url="$PR_URL" ask "Check all variable and function names. Are they in camelCase? If not, list the ones that need to be changed."
        pr-agent --pr_url="$PR_URL" ask "Analyze all functions in the changed files. Are there any edge cases that aren't handled? If so, list them and suggest improvements."
        pr-agent --pr_url="$PR_URL" ask "Review the entire files where changes were made. Is there any code duplication? If so, suggest ways to reduce redundancy."
        pr-agent --pr_url="$PR_URL" improve --extended
 
      env:
        azure_devops__pat: $(azure_devops_pat)
        openai__key: $(OPENAI_KEY)
        openai__api_type: "azure"
        openai__api_version: '2024-05-01-preview'
        openai__api_base: "https://3in1-chatbot-yellow-messenger-poc.openai.azure.com/"
        openai__deployment_id: "gpt-4o"
      displayName: 'Run Code Review'
