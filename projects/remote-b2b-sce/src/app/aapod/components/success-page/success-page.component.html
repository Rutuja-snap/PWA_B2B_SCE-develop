<div class="aa_white_background aa_viewport">
    <div class="aa_desktop_width aa_padding_common aa_screen_center">
        <div class="aa_success_screen_container">
            <div class="aa_success_screen_image">
                <img class="aa_success_screen_image_section"
                    [src]= "aemData?.congratulations?.['iconimage-android']"
                    alt="loading image">
            </div>
            <div class="aa_success_screen_content">
                <h2 class="aa_success_screen_content_heading">{{ aemData?.congratulations?.icontitle }}</h2>
                <span class="aa_success_screen_content_desc">{{ aemData?.congratulations?.icondescription}}</span>
            </div>
        </div>
    </div>
</div>
